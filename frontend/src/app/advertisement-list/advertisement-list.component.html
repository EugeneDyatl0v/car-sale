<div class="page">

        <input [(ngModel)]="searchQuery" type="text" class="search-input" placeholder="Введите запрос...">
        <button class="button button-filter" (click)="openModal()"></button>
        <button class="button button-search" (click)="onSearch()"></button>
    </div>
    -->
<div class="filters">
  <div class="row">
    <div class="column">
        <input
      type="text"
      list="brand_options"
      placeholder="Выберите марку"
      [(ngModel)]="selectedBrand"
      (change)="onBrandChange()"
    />
    <datalist id="brand_options">
      <option *ngFor="let value of brands" [value]="value">{{value}}</option>
    </datalist>

    </div>
    <div class="column">
        <input
      type="text"
      list="model_options"
      placeholder="Выберите модель"
      [(ngModel)]="selectedModel"
    />
    <datalist id="model_options">
      <option *ngFor="let value of models" [value]="value">{{value}}</option>
    </datalist>
    </div>
    <div class="column">
      <select >
          <option value="" disabled selected >Выберите привод</option>
        <option >Передний привод</option>
        <option>Задний привод</option>
        <option>Полный привод</option>
      </select>
    </div>
  </div>

    <div class="row">
      <div class="column">
        <select >
          <option value="" disabled selected hidden>Выберите тип кузова</option>
          <option> Седан</option>
          <option> Внедорожник</option>
          <option> Хетчбэк</option>
          <option> Универсал</option>
          <option> Купе</option>
          <option> Минивэн</option>
      </select>
      </div>
      <div class="column">
        <select >
          <option value="" disabled selected hidden>Выберите тип топлива</option>
          <option >Бензин</option>
          <option> Дизель</option>
          <option> Электричество</option>
          <option> Гибрид</option>
          <option> Газ
          </option>
      </select>
      </div>
      <div class="column">
              <select>
        <option value="" disabled selected hidden>Выберите КПП</option>
                <option>Автомат</option>
                <option> Механика</option>
                <option> Робот
          </option>
      </select>
      </div>
    </div>
  <div class="row">
    <div class="column-from-to">
      <input class="from-select" placeholder="Пробег от" type="number">
      <input class="to-select" placeholder="Пробег до" type="number">
    </div>
    <div class="column-from-to">
      <input class="from-select" placeholder="Год от" type="number">
      <input class="to-select" placeholder="Год до" type="number">
    </div>
    <div class="column-from-to">
      <input class="from-select" placeholder="Цена от" type="number">
      <input class="to-select" placeholder="Цена до" type="number">
    </div>
  </div>

  <div class="row">
    <div class="column-from-to">
      <input class="from-select" placeholder="Объём от" type="number">
      <input class="to-select" placeholder="Объём до" type="number">
    </div>
    <div class="column-from-to">
      <input class="from-select" placeholder="Мощность от" type="number">
      <input class="to-select" placeholder="Мощность до" type="number">
    </div>
  </div>
      <button type="submit" class="submit-btn" (click)="onSubmit()">Подтвердить</button>

</div>



  <div class="grid-container" >
    <div *ngFor="let ad of ads!.data.list" class="add">
      <h4>{{ ad.brand }} {{ ad.model }}</h4>
      <img [src]="imagePaths[ad.id]" alt="main-photo" width="360" height="240">
      <h5> Цена: {{ ad.price }} {{ ad.currency }}</h5>
      <h5> Год: {{ ad.year }}</h5>
      <button (click)="open_ad(ad.id)">Подробнее</button>
    </div>
  </div>

  <div class="pagination">
    <button  (click)="setPage(current_page - 1)" [disabled]="current_page === 1">« Пред</button>
      <span *ngFor="let page of [].constructor(pages_count); let i = index">
        <button  (click)="setPage(i + 1)" [class.active]="current_page === i + 1">{{ i + 1 }}</button>
      </span>
    <button  (click)="setPage(current_page + 1)" [disabled]="current_page === pages_count">След »</button>
  </div>

</div>
